name: Publish wrap PNGs

on:
  push:
    paths:
      - "wraps-b64/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Paint Shop PNGs
        run: |
          mkdir -p dist/Wraps
          for f in wraps-b64/*.b64; do
            base=$(basename "$f" .b64)
            base64 -d "$f" > "dist/Wraps/$base"
          done
          (cd dist && zip -r ../Tesla_Batman_PaintShop.zip Wraps)
          file dist/Wraps/*.png
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 dist/Wraps/*.png Tesla_Batman_PaintShop.zip \
            --title "Paint Shop wraps" \
            --notes "PNG files for Tesla Model Y Juniper Paint Shop. Prem is Premium / Long Range. Std is Standard."
