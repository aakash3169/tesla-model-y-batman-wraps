name: Publish wrap PNGs

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download official Juniper templates
        run: |
          mkdir -p templates
          curl -fsSL -o templates/premium_template.png https://raw.githubusercontent.com/teslamotors/custom-wraps/master/modely-2025-premium/template.png
          curl -fsSL -o templates/base_template.png https://raw.githubusercontent.com/teslamotors/custom-wraps/master/modely-2025-base/template.png
      - name: Generate Paint Shop PNGs
        run: python scripts/make_batman_wraps.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 dist/Wraps/*.png dist/Tesla_Batman_PaintShop.zip \
            --title "Paint Shop wraps" \
            --notes "PNG files for Tesla Model Y Juniper Paint Shop. Prem is Premium / Long Range. Std is Standard."
